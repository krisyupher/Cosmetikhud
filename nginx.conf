server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;
  server_tokens off;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # Security headers. Locations below use `expires` instead of `add_header`
  # so these are inherited everywhere.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  # Vite output has hashed file names: cache for a year, 404 when missing.
  location /assets/ {
    try_files $uri =404;
    expires 1y;
  }

  # Product list: always revalidated, so edits to products.json show on the next refresh.
  location /data/ {
    try_files $uri =404;
    expires -1;
  }

  # Product photos (no hash in the name): short cache so a replaced image shows up soon.
  location /products/ {
    try_files $uri =404;
    expires 1h;
  }

  # Always revalidate the page so a new deploy shows up right away.
  location = /index.html {
    expires -1;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
